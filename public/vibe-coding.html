    <style>
    /* ---------------------------------------------------
       GLOBAL  ─ brand colours, gradient & noise overlay
    --------------------------------------------------- */
    :root{
        --purple-gradient:            linear-gradient(120deg, #9179eb 0%, #6c38fa 55%, #4a1fb8 100%);
        --purple-gradient-inverse:    linear-gradient(180deg, #9179eb 0%, #6c38fa 100%);
        --chat-background-color:      #8A2BE2;
        --ai-color:                   #A6FFA3;
        --user-color:                 #FFF7F6;
        --background-color:           #28044A;
        --darkest-color:              #6c38fa;

        --glass-tint:        rgba(255, 255, 255, 0.10);
        --glass-tint-strong: rgba(255, 255, 255, 0.18);
        --glass-stroke:      rgba(255, 255, 255, 0.28);
        --glass-stroke-soft: rgba(255, 255, 255, 0.16);
        --glass-shadow:
            0 1px 0 rgba(255,255,255,0.35) inset,
            0 -1px 0 rgba(255,255,255,0.08) inset,
            0 8px 32px rgba(20, 0, 60, 0.28),
            0 2px 8px rgba(20, 0, 60, 0.18);
        --glass-blur: 22px;
        --glass-radius: 18px;
    }

    html, body{
        margin:0;
        min-height:100vh;
        background:var(--purple-gradient);
        font-family:'Signika', sans-serif;
        color:#FFF;
    }



    /* ---------------------------------------------------
       LAYOUT  ─ responsive grid of preview cards
    --------------------------------------------------- */
    .vibe-coding-grid{
        display:grid;
        gap:1.5rem;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        margin:2rem auto;
        width:90%;
        max-width:1600px;
        position:relative;           /* keep content above noise overlay */
        z-index:2;
    }

    /* ---------------------------------------------------
       COMPONENT  ─ preview card
    --------------------------------------------------- */
    .preview-card{
        display:flex;
        flex-direction:column;
        background:rgba(255,255,255,0.10);
        border:1px solid var(--glass-stroke);
        border-radius:var(--glass-radius);
        overflow:hidden;
        box-shadow:var(--glass-shadow);
        position:relative;
        isolation:isolate;
        transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
    }
    .preview-card::before{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        border-radius:inherit;
        background:
            linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 35%),
            radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.35), transparent 60%);
        mix-blend-mode:screen;
        z-index:0;
    }
    .preview-card > * { position:relative; z-index:1; }
    .preview-card:hover{
        transform:translateY(-3px);
        background:var(--glass-tint-strong);
        box-shadow:
            0 1px 0 rgba(255,255,255,.45) inset,
            0 -1px 0 rgba(255,255,255,.08) inset,
            0 14px 40px rgba(20,0,60,.35),
            0 4px 14px rgba(20,0,60,.22);
    }

    /* Card heading */
    .preview-card h3{
        margin:0;
        padding:.75rem 1rem;
        font-size:1.1rem;
        text-align:center;
        background:rgba(166,255,163,.85);
        color:#8A2BE2;
        font-family:'Signika', sans-serif;
        border-bottom:1px solid var(--glass-stroke-soft);
    }
    .preview-card h3 a{ color:inherit; text-decoration:none; }

    /* ---------------------------------------------------
       ASPECT-RATIO preview frame
    --------------------------------------------------- */
    .preview-frame{
        position:relative;
        width:100%;
        aspect-ratio:9/10;           /* Graceful fallback below */
    }
    @supports not (aspect-ratio:9/10){
        .preview-frame{padding-top:56.25%;}
        .preview-frame>*{position:absolute;inset:0;}
    }
    .preview-frame iframe{position:absolute;inset:0;border:0;width:100%;height:100%;}

    /* Placeholder for “coming soon” cards */
    .preview-frame.placeholder{
        display:flex;
        align-items:center;
        justify-content:center;
        background:rgba(255,255,255,.06);
    }
    .placeholder-emoji{font-size:3.5rem;line-height:1;}
    </style>
</head>

<script>
(function(){
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      var f = e.target;
      var src = f.getAttribute('data-src');
      if (src) { f.src = src; f.removeAttribute('data-src'); }
      io.unobserve(f);
    });
  }, { rootMargin: '300px 0px' });
  document.querySelectorAll('iframe[data-src]').forEach(function(f){ io.observe(f); });
})();
</script>
