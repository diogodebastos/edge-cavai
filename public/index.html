<!DOCTYPE html>
<!-- background matches --brand-purple in shared.css (FOUC prevention) -->
<html lang="en" style="background:#4a1fb8">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>db</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" as="font" href="/fonts/signika-variable.woff2" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/signika.css">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/chat.css">
    <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('theme');if(t==='dark'){d.classList.add('dark-theme');}else if(t==='light'){d.classList.remove('dark-theme');}d.style.removeProperty('background');}catch(e){}self.addEventListener('pagereveal',function(e){if(e.viewTransition){d.classList.add('vt-nav');e.viewTransition.finished.then(function(){d.classList.remove('vt-nav');});}});})();</script>
</head>
<body>
<div class="chat-container" id="chatContainer">
  <header class="site-header">
    <nav class="nav-pills" aria-label="Primary" style="width:100%;">
      <a href="/" class="nav-pill is-current" aria-current="page">Chat</a>
      <a href="/cv" class="nav-pill">CV</a>
      <a href="/blog" class="nav-pill">Blog</a>
      <a href="/vibe-coding" class="nav-pill nav-pill-quiet">✦</a>
      <!-- <button type="button" class="nav-pill nav-pill-reset" id="reset-chat" hidden aria-label="New chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span>New chat</span>
      </button> -->
      <button class="theme-toggle-button" id="theme-toggle" aria-label="Switch theme" type="button">&#9728;&#65038;</button>
    </nav>
  </header>
  <div class="card">
    <div class="card-body messages-box">
      <section class="chat-hero" data-stagger>
        <p class="eyebrow">Chat with my CV</p>
        <h1 class="hero-title">Hi, I'm Diogo.</h1>
        <p class="hero-sub">Ask anything about my work — or paste a job description for a quick fit check.</p>
        <div class="suggestion-chips" role="group" aria-label="Suggested prompts">
          <button type="button" class="chip" data-prompt="What are Diogo's top strengths?">Top strengths?</button>
          <button type="button" class="chip" data-prompt="Does Diogo match a senior AI engineering role? Why or why not?">Fit for a role?</button>
          <button type="button" class="chip" data-prompt="What has Diogo built recently?">What's he built?</button>
        </div>
      </section>
      <ul class="messages-list"></ul>
    </div>
  </div>
  <form class="message-form">
    <div class="input-group">
      <input type="text" class="message-input" placeholder="Ask about Diogo or paste a job description…" aria-label="Message">
      <button type="submit" class="btn-send" aria-label="Send">
        <span class="btn-send-label">Send</span>
        <svg class="btn-send-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </form>
  <div class="footer">
    <span class="meta">Powered by OpenAI · Built by <a href="https://www.linkedin.com/in/diogodebastos/" target="_blank" rel="noopener">db</a></span>
  </div>
</div>
<script src="/js/prefetch.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/chat.js"></script>
<script>if (typeof initTheme === 'function') initTheme('theme-toggle');</script>
<script>
(function(){
  function loadGA(){
    if (window.__ga_loaded) return; window.__ga_loaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L58TRTVXWP';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-L58TRTVXWP');
  }
  if ('requestIdleCallback' in window) requestIdleCallback(loadGA, { timeout: 4000 });
  else setTimeout(loadGA, 2500);
})();
</script>
</body>
</html>
